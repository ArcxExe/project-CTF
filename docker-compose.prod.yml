services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=192MB
      -c max_connections=25
    environment:
      POSTGRES_DB: ${DB_NAME:-ctf_platform}
      POSTGRES_USER: ${DB_USER:-ctf_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ctf_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ctf_user} -d ${DB_NAME:-ctf_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -Xss256k -XX:TieredStopAtLevel=1"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      SERVER_TOMCAT_THREADS_MAX: 30
      SERVER_TOMCAT_THREADS_MIN_SPARE: 4
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ctf_platform}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-ctf_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-ctf_password}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ctf_platform}
      DB_USER: ${DB_USER:-ctf_user}
      DB_PASSWORD: ${DB_PASSWORD:-ctf_password}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-3600000}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}
    mem_limit: 480m
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.runtime
    restart: unless-stopped
    depends_on:
      - backend
    mem_limit: 64m
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
